# Default run configuration. Any key can be overridden with a JVM system property,
# e.g. mvn test -Dbrowser=firefox -Dheadless=true -DexplicitWaitSeconds=20

baseUrl=https://opensource-demo.orangehrmlive.com
# Public demo credentials published on the OrangeHRM login page.
username=Admin
password=admin123

# chrome | firefox | edge
browser=chrome
headless=false
windowWidth=1920
windowHeight=1080

# The public demo is shared and sometimes slow; generous explicit waits avoid false failures.
explicitWaitSeconds=30
pageLoadTimeoutSeconds=90
